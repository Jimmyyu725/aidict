<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AIDict Capture</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #202124; }
    body { font: 14px system-ui, sans-serif; color: #fff; cursor: crosshair; user-select: none; }
    #toolbar {
      position: fixed; inset: 0 0 auto 0; height: 46px; display: flex; align-items: center;
      justify-content: center; z-index: 5; background: #292a2d; box-shadow: 0 1px 4px #0008;
    }
    #stage { position: fixed; inset: 46px 0 0; }
    #capture {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      max-width: 100%; max-height: 100%; display: block;
    }
    #box {
      position: fixed; z-index: 4; display: none; pointer-events: none;
      border: 2px solid #4da3ff; background: rgba(77, 163, 255, .14); box-sizing: border-box;
    }
    #picker {
      position: fixed; z-index: 6; display: none; max-width: 420px; padding: 10px;
      background: #fff; color: #1a1a1a; border-radius: 10px; box-shadow: 0 8px 30px #0008;
    }
    #picker button { margin: 3px; padding: 5px 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="toolbar">Drag a box around a word or sentence in the PDF</div>
  <div id="stage"><img id="capture" alt="Captured PDF viewport"></div>
  <div id="box"></div>
  <div id="picker"></div>
  <script src="capture.js"></script>
</body>
</html>
